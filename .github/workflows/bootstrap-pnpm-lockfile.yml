name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - fix/ci-openapi-route-drift-2026-11-19

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: ${{ !hashFiles('pnpm-lock.yaml') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate deterministic workspace lockfile without executing package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile to the triggering branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "build: add pnpm workspace lockfile"
          git push
