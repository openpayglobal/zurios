name: CI
on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop, "feature/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Start MongoDB replica set
        run: |
          docker run -d --name zuri-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec zuri-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec zuri-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do
            if docker exec zuri-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become primary"
          docker logs zuri-mongo
          exit 1
      - name: Validate OpenAPI 3.1 contract
        run: pnpm --package=@redocly/cli dlx redocly lint docs/api/openapi.yaml
      - name: Check OpenAPI route drift
        run: pnpm --filter @zuri/api openapi:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke-test Fastify API with MongoDB
        env:
          NODE_ENV: test
          API_HOST: 127.0.0.1
          API_PORT: 4100
          MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
          MONGODB_DATABASE: zuri_ci
          JWT_ISSUER: https://zuri-ci.example
          JWT_AUDIENCE: zuri-ci
          JWT_SECRET: ci-only-secret-that-is-never-used-outside-this-job
          CORS_ORIGINS: http://localhost:5173
        run: |
          set -euo pipefail
          node apps/api/dist/server.js > /tmp/zuri-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; sleep 1; kill -9 "$API_PID" 2>/dev/null || true' EXIT
          LIVE_OK=0
          for i in $(seq 1 30); do
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/zuri-api.log
              exit 1
            fi
            if curl --max-time 2 -fsS http://127.0.0.1:4100/health/live; then
              LIVE_OK=1
              break
            fi
            sleep 1
          done
          if [ "$LIVE_OK" -ne 1 ]; then
            cat /tmp/zuri-api.log
            exit 1
          fi
          curl --max-time 5 -fsS http://127.0.0.1:4100/health/ready
          cat /tmp/zuri-api.log
