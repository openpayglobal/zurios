name: CI
on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - name: Initialize MongoDB replica set
        run: |
          mongosh mongodb://localhost:27017/admin --quiet --eval 'rs.initiate()'
          for i in $(seq 1 30); do
            if mongosh mongodb://localhost:27017/admin --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become primary"
          exit 1
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
