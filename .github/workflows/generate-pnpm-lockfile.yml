name: Generate pnpm lockfile

on:
  push:
    branches:
      - fix/vercel-pnpm-node22
    paths:
      - .github/workflows/generate-pnpm-lockfile.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-pnpm-node22
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate lockfile with repository-pinned pnpm
        run: |
          corepack enable
          corepack pnpm --version
          corepack pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "build(deps): add pnpm workspace lockfile"
            git push origin HEAD:fix/vercel-pnpm-node22
          fi
