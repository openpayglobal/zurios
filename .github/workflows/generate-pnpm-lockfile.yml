name: Generate pnpm lockfile

on:
  push:
    branches:
      - fix/vercel-pnpm-node22
    paths:
      - .github/workflows/generate-pnpm-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/vercel-pnpm-node22
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate lockfile
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          corepack pnpm install --lockfile-only --no-frozen-lockfile
          test -s pnpm-lock.yaml
          corepack pnpm install --frozen-lockfile
      - name: Commit generated lockfile
        run: |
          git add -f pnpm-lock.yaml
          if ! git diff --cached --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(deps): add pnpm workspace lockfile"
            git push origin HEAD:fix/vercel-pnpm-node22
          fi
