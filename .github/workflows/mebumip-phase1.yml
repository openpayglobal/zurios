name: Zuri MeBuMIP Phase 1 verification

on:
  push:
    branches:
      - feat/zuri-mebumip-foundation
      - feat/mebumip-phase1-security-hardening
  pull_request:
    branches:
      - main
    paths:
      - "apps/mebumip-api/**"
      - "apps/mebumip-web/**"
      - "products/zuri-mebumip/**"
      - ".github/workflows/mebumip-phase1.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mebumip-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mebumip-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done
          docker exec mebumip-mongo mongosh --quiet --eval 'rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]})'
          for i in $(seq 1 30); do
            if docker exec mebumip-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 1
          done
          echo "MongoDB replica set did not become primary"
          docker logs mebumip-mongo
          exit 1
      - name: API typecheck
        run: pnpm --filter @zuri/mebumip-api typecheck
      - name: API tests
        run: pnpm --filter @zuri/mebumip-api test
      - name: API build
        run: pnpm --filter @zuri/mebumip-api build
      - name: Web typecheck
        run: pnpm --filter @zuri/mebumip-web typecheck
      - name: Web build
        run: pnpm --filter @zuri/mebumip-web build
