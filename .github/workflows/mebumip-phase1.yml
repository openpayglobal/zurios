name: Zuri MeBuMIP Phase 1 verification

on:
  push:
    branches:
      - feat/zuri-mebumip-foundation
  pull_request:
    branches:
      - main
    paths:
      - "apps/mebumip-api/**"
      - "apps/mebumip-web/**"
      - "products/zuri-mebumip/**"
      - ".github/workflows/mebumip-phase1.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MFA_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      AUDIT_SIGNING_KEY: mebumip-ci-audit-signing-key-with-test-only-entropy
      PLATFORM_BOOTSTRAP_TOKEN: mebumip-ci-bootstrap-token-test-only-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: 7.0
          mongodb-replica-set: rs0
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: API typecheck
        run: pnpm --filter @zuri/mebumip-api typecheck
      - name: API tests
        run: pnpm --filter @zuri/mebumip-api test
      - name: API build
        run: pnpm --filter @zuri/mebumip-api build
      - name: Web typecheck
        run: pnpm --filter @zuri/mebumip-web typecheck
      - name: Web build
        run: pnpm --filter @zuri/mebumip-web build
