openapi: 3.1.0
info:
  title: Zuri MeBuMIP API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    API contract for Zuri Meta Business Management and Integration Platform.
    This specification describes the currently implemented MAC/MAD audit endpoints.
servers:
  - url: /
    description: API root; deployment base URL is configured per environment.
security:
  - bearerAuth: []
tags:
  - name: MAC Audit
    description: Privileged audit verification, export and archive preparation.
  - name: MAD
    description: Read-only operational visibility.
paths:
  /v1/mac/audit-events:
    get:
      tags: [MAC Audit]
      operationId: listMeBuMIPAuditEvents
      summary: List recent audit events
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: before, in: query, required: false, schema: {type: string, description: MongoDB ObjectId cursor}}
      responses:
        "200": {description: Audit event page; includes a stable cursor and retention notice}
        "401": {description: Authentication required}
        "403": {description: Platform audit-read permission required}
  /v1/mac/audit-events/verify:
    get:
      tags: [MAC Audit]
      operationId: verifyRecentMeBuMIPAuditEvents
      summary: Verify signatures and sequence continuity for the latest 500 audit events
      responses:
        "200": {description: "Counts of verified, unsigned and invalid events plus detected sequence gaps"}
        "401": {description: Authentication required}
        "403": {description: Platform audit-read permission required}
  /v1/mac/audit-events/export:
    get:
      tags: [MAC Audit]
      operationId: exportMeBuMIPAuditEvents
      summary: Download a signed audit export page and manifest
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
        - {name: before, in: query, required: false, schema: {type: string, description: MongoDB ObjectId cursor}}
      responses:
        "200": {description: Signed export manifest and event records; export is not an independent immutable archive}
        "401": {description: Authentication required}
        "403": {description: Platform audit-read permission required}
  /v1/mac/audit-events/archive:
    get:
      tags: [MAC Audit]
      operationId: prepareImmutableMeBuMIPAuditArchive
      summary: Prepare a signed, contiguous, content-addressed archive package for external immutable storage
      parameters:
        - {name: fromSequence, in: query, required: true, schema: {type: integer, minimum: 1}}
        - {name: toSequence, in: query, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200": {description: Signed archive package download with SHA-256 and content-addressed object-key headers; prepared but not stored}
        "400": {description: Invalid sequence range}
        "401": {description: Authentication required}
        "403": {description: Platform audit-read permission required}
        "409": {description: "Sequence gap, unsigned manifest or invalid event signature"}
        "503": {description: Audit signing key is not configured}
  /v1/mad/overview:
    get:
      tags: [MAD]
      operationId: getMeBuMIPOperationalOverview
      summary: Read operational aggregates for the MAD dashboard
      responses:
        "200": {description: Read-only operational aggregates}
        "401": {description: Authentication required}
        "403": {description: Platform metrics-read permission required}
  /v1/workspace/onboarding:
    get:
      tags: [Customer Workspace]
      operationId: getCustomerWorkspaceOnboarding
      summary: Read onboarding progress for an authorized tenant workspace
      parameters:
        - {name: tenantId, in: query, required: true, schema: {type: string, minLength: 1}}
      responses:
        "200": {description: Tenant-scoped onboarding checklist, business profile, member count and redacted connection metadata}
        "401": {description: Authentication required}
        "403": {description: Active tenant membership and permission required}
  /v1/workspace/onboarding/business-profile:
    put:
      tags: [Customer Workspace]
      operationId: updateCustomerBusinessProfile
      summary: Save the active tenant business profile with an atomic audit event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId, legalName, displayName, industry, countryCode, timezone, contactEmail]
              properties:
                tenantId: {type: string}
                legalName: {type: string, minLength: 2, maxLength: 200}
                displayName: {type: string, minLength: 2, maxLength: 120}
                industry: {type: string, minLength: 2, maxLength: 100}
                countryCode: {type: string, pattern: "^[A-Z]{2}$"}
                timezone: {type: string, minLength: 3, maxLength: 80}
                website: {type: string, format: uri}
                contactEmail: {type: string, format: email}
      responses:
        "200": {description: Profile saved and audit event committed}
        "400": {description: Invalid profile}
        "401": {description: Authentication required}
        "403": {description: Tenant write permission required}
  /v1/workspace/onboarding/meta/connect:
    post:
      tags: [Customer Workspace]
      operationId: beginCustomerMetaConnection
      summary: Begin Meta OAuth connection when provider prerequisites are configured
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: {type: string}
      responses:
        "401": {description: Authentication required}
        "403": {description: Tenant Meta connection permission required}
        "503": {description: Meta OAuth is not configured; no connection is created}
  /v1/tenants/{tenantId}/members:
    get:
      tags: [Customer Workspace]
      operationId: listCustomerWorkspaceMembers
      summary: List members and pending invitations for an authorized tenant
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Tenant members and redacted pending invitations}
        "401": {description: Authentication required}
        "403": {description: Tenant membership read permission required}
  /v1/tenants/{tenantId}/invitations:
    post:
      tags: [Customer Workspace]
      operationId: inviteCustomerWorkspaceMember
      summary: Invite a team member after MFA step-up
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, format: email}
                role: {type: string, enum: [tenant_admin, publisher, advertiser, support_agent, viewer]}
      responses:
        "201": {description: Invitation sent}
        "401": {description: Authentication required}
        "403": {description: Tenant write permission or recent MFA step-up required}
        "503": {description: Invitation email delivery unavailable}
  /v1/mac/infrastructure:
    get:
      tags: [MAC Infrastructure]
      operationId: getMacInfrastructureInventory
      summary: Read non-secret infrastructure and keyring readiness metadata
      responses:
        "200": {description: Masked database topology, KMS keyring metadata, origins and provider readiness}
        "401": {description: Authentication required}
        "403": {description: Platform settings-read permission required}
  /v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerTenantUserFromInvitation
      summary: Create a verified customer account from a single-use tenant invitation
      description: Invitation token possession verifies the invited email. User creation, tenant membership activation, invitation consumption and audit event are committed in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, displayName]
              properties:
                token: {type: string, minLength: 40, maxLength: 200}
                email: {type: string, format: email}
                password: {type: string, minLength: 12, maxLength: 256}
                displayName: {type: string, minLength: 2, maxLength: 100}
      responses:
        "201": {description: Customer account created and tenant membership activated}
        "400": {description: Invalid registration data or invitation role}
        "404": {description: Invitation invalid, expired or email mismatch}
        "409": {description: Existing account, inactive tenant or invitation already used}
        "500": {description: Registration transaction failed}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
