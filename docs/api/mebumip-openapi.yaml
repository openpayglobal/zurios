      type: http
      scheme: bearer
      bearerFormat: JWT
}}
      responses:
        "200":
          description: Tenant Meta connections
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/MetaConnectionSummary"}
        "401": {description: Authentication required}
        "403": {description: Tenant connection-read permission required}
  /v1/tenants/{tenantId}/meta/connections/{connectionId}:
    delete:
      tags: [Meta Integrations]
      operationId: revokeTenantMetaConnection
      summary: Disconnect a tenant Meta connection and erase its local token
      description: Requires tenant meta:connections:write permission and recent MFA step-up. The API attempts to revoke the Meta user permission, then always clears the local encrypted token and audits the remote outcome.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{24}    get:
      tags: [MAD]
      operationId: getMeBuMIPOperationalOverview
      summary: Read operational aggregates for the MAD dashboard
      responses:
        "200": {description: Read-only operational aggregates}
        "401": {description: Authentication required}
        "403": {description: Platform metrics-read permission required}
