  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
}}
        - {name: connectionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Local token erased; remote permission revocation outcome is explicit
          content:
            application/json:
              schema:
                type: object
                required: [status, remoteRevocation]
                properties:
                  status: {type: string, const: disconnected}
                  remoteRevocation: {type: string, enum: [succeeded, failed, not_attempted]}
        "401": {description: Authentication required}
        "403": {description: Tenant connection-write permission or recent MFA step-up required}
        "404": {description: Connection not found in this tenant}
  /v1/mad/overview:
    get:
      tags: [MAD]
      operationId: getMeBuMIPOperationalOverview
      summary: Read operational aggregates for the MAD dashboard
      responses:
        "200": {description: Read-only operational aggregates}
        "401": {description: Authentication required}
        "403": {description: Platform metrics-read permission required}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
