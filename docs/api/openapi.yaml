      summary: Create a preventive or corrective maintenance work order
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaintenanceWorkOrder"}
      responses:
        "201": {description: Maintenance work order created}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Active asset not found}
  /assets/maintenance-work-orders/{workOrderId}/complete:
    post:
      tags: [Assets & Maintenance]
      operationId: completeMaintenanceWorkOrder
      summary: Complete a maintenance work order with version-checked actual cost
      parameters:
        - {name: workOrderId, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MaintenanceCompletion"}
      responses:
        "200": {description: Work order completed}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Work order not found}
        "409": {$ref: "#/components/responses/Conflict"}
  /projects:
    get:
      tags: [Project Management]
      operationId: listProjects
      summary: List projects in authorized organizations
      responses:
        "200": {description: Scoped projects}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Project Management]
      operationId: createProject
      summary: Create a project with budget and delivery dates
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Project"}
      responses:
        "201": {description: Project created}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /projects/{projectId}/tasks:
    post:
      tags: [Project Management]
      operationId: createProjectTask
      summary: Create a task under an active project
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectTask"}
      responses:
        "201": {description: Project task created}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {description: Active project not found}
  /projects/{projectId}/time-entries:
    get:
      tags: [Project Management]
      operationId: listProjectTimeEntries
      summary: List project time entries in authorized organizations
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Scoped project time entries}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [Project Management]
      operationId: submitProjectTimeEntry
      summary: Submit employee time against an organization-owned project task
      parameters:
        - {name: projectId, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectTimeEntry"}
      responses:
        "201": {description: Time entry submitted}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {description: Employee or task not found}
  /projects/time-entries/{timeEntryId}/approve:
    post:
      tags: [Project Management]
      operationId: approveProjectTimeEntry
      summary: Approve submitted time with requester/approver separation
      parameters:
        - {name: timeEntryId, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectTimeEntryDecision"}
      responses:
        "200": {description: Time entry approved}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /projects/time-entries/{timeEntryId}/reject:
    post:
      tags: [Project Management]
      operationId: rejectProjectTimeEntry
      summary: Reject submitted time with an auditable reason
      parameters:
        - {name: timeEntryId, in: path, required: true, schema: {type: string}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectTimeEntryDecision"}
      responses:
        "200": {description: Time entry rejected}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key for safe retries. The same key and request replay the original response for 24 hours; reusing it with a different request returns 409.
      schema: {type: string, minLength: 8, maxLength: 128}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthenticated:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Permission or scope denied
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Conflicting or duplicate state
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidReference:
      description: Referenced resource is invalid or outside required scope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    CreateWarehouse:
      type: object
      required: [warehouseId, code, name, locationId, status]
      properties:
        warehouseId: {type: string, minLength: 1}
        code: {type: string, minLength: 1, maxLength: 32}
        name: {type: string, minLength: 2, maxLength: 160}
        locationId: {type: string, minLength: 1}
        status: {type: string, enum: [active, inactive]}
    StockMovement:
      type: object
      required: [idempotencyKey, movementId, movementType, sku, warehouseId, quantityMilli, referenceType, referenceId, occurredAt]
      properties:
        idempotencyKey: {type: string, minLength: 8, maxLength: 200}
        movementId: {type: string, minLength: 1}
        movementType: {type: string, enum: [receipt, issue, transfer, adjustment]}
        sku: {type: string, minLength: 1, maxLength: 100}
        warehouseId: {type: string, minLength: 1}
        destinationWarehouseId: {type: string}
        quantityMilli: {type: integer, minimum: 1}
        unitCostMinor: {type: integer, minimum: 0}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        referenceType: {type: string, minLength: 1}
        referenceId: {type: string, minLength: 1}
        reason: {type: string, minLength: 3, maxLength: 500}
        adjustmentDirection: {type: string, enum: [increase, decrease]}
        occurredAt: {type: string, format: date-time}
    StockReservation:
      type: object
      required: [idempotencyKey, reservationId, orderId, warehouseId, lines, status, expiresAt]
      properties:
        idempotencyKey: {type: string, minLength: 8, maxLength: 200}
        reservationId: {type: string, minLength: 1}
        orderId: {type: string, minLength: 1}
        warehouseId: {type: string, minLength: 1}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantityMilli]
            properties:
              sku: {type: string, minLength: 1}
              quantityMilli: {type: integer, minimum: 1}
        status: {type: string, enum: [reserved]}
        expiresAt: {type: string, format: date-time}
    PosTerminal:
      type: object
      required: [terminalId, code, locationId, deviceId, status]
      properties:
        terminalId: {type: string, minLength: 1}
        code: {type: string, minLength: 1, maxLength: 32}
        locationId: {type: string, minLength: 1}
        deviceId: {type: string, minLength: 1}
        status: {type: string, enum: [active, inactive, maintenance]}
    PosShiftOpen:
      type: object
      required: [shiftId, terminalId, cashierId, currency, openedAt, openingFloatMinor, status]
      properties:
        shiftId: {type: string, minLength: 1}
        terminalId: {type: string, minLength: 1}
        cashierId: {type: string, minLength: 1}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        openedAt: {type: string, format: date-time}
        openingFloatMinor: {type: integer, minimum: 0}
        status: {type: string, enum: [open]}
    PosShiftClose:
      type: object
      required: [expectedCashMinor, countedCashMinor]
      properties:
        expectedCashMinor: {type: integer, minimum: 0}
        countedCashMinor: {type: integer, minimum: 0}
    PosSale:
      type: object
      required: [saleId, terminalId, cashierId, currency, lines, subtotalMinor, taxMinor, totalMinor, status, completedAt]
      properties:
        saleId: {type: string, minLength: 1}
        reservationId: {type: string}
        terminalId: {type: string, minLength: 1}
        cashierId: {type: string, minLength: 1}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, description, quantityMilli, unitPriceMinor, taxRateBps]
            properties:
              sku: {type: string}
              description: {type: string}
              quantityMilli: {type: integer, minimum: 1}
              unitPriceMinor: {type: integer, minimum: 0}
              discountMinor: {type: integer, minimum: 0, default: 0}
              taxRateBps: {type: integer, minimum: 0, maximum: 10000}
        subtotalMinor: {type: integer, minimum: 0}
        taxMinor: {type: integer, minimum: 0}
        totalMinor: {type: integer, minimum: 1}
        tenders:
          type: array
          items:
            type: object
            required: [tenderId, method, amountMinor, currency, status]
            properties:
              tenderId: {type: string}
              method: {type: string, enum: [cash, card, mobile_money, store_credit, voucher]}
              amountMinor: {type: integer, minimum: 1}
              currency: {type: string}
              status: {type: string, enum: [pending, authorized, captured, failed, refunded]}
              providerReference: {type: string}
        status: {type: string, enum: [completed]}
        completedAt: {type: string, format: date-time}
    PosRefund:
      type: object
      required: [refundId, saleId, originalSaleTotalMinor, amountMinor, currency, reason, status]
      properties:
        refundId: {type: string}
        saleId: {type: string}
        originalSaleTotalMinor: {type: integer, minimum: 1}
        amountMinor: {type: integer, minimum: 1}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        reason: {type: string, minLength: 3, maxLength: 500}
        status: {type: string, enum: [completed]}
        completedAt: {type: string, format: date-time}
    PosOfflineCommand:
      type: object
      required: [terminalId, commandId, sequence, commandType, payload, issuedAt]
      properties:
        terminalId: {type: string}
        commandId: {type: string, minLength: 8}
        sequence: {type: integer, minimum: 1}
        commandType: {type: string, minLength: 1, maxLength: 80}
        payload: {type: object, additionalProperties: true}
        issuedAt: {type: string, format: date-time}
    ErpAccount:
      type: object
      required: [organizationId, accountCode, name, accountType, normalBalance]
      properties:
        organizationId: {type: string, minLength: 1}
        accountCode: {type: string, minLength: 1, maxLength: 32}
        name: {type: string, minLength: 2, maxLength: 160}
        accountType: {type: string, enum: [asset, liability, equity, income, expense]}
        normalBalance: {type: string, enum: [debit, credit]}
        parentAccountCode: {type: string}
        requiresCostCenter: {type: boolean, default: false}
        status: {type: string, enum: [active, inactive], default: active}
    ErpFiscalPeriod:
      type: object
      required: [organizationId, periodId, periodCode, startsAt, endsAt, status]
      properties:
        organizationId: {type: string, minLength: 1}
        periodId: {type: string}
        periodCode: {type: string, maxLength: 32}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [open, closed]}
    ErpPurchaseOrder:
      type: object
      required: [orderNumber, supplierId, warehouseId, currency, orderedAt, lines, totalMinor, status]
      properties:
        orderNumber: {type: string, maxLength: 64}
        supplierId: {type: string}
        warehouseId: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        orderedAt: {type: string, format: date-time}
        expectedAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, description, quantityMilli, unitPriceMinor, taxRateBps]
            properties:
              sku: {type: string}
              description: {type: string}
              quantityMilli: {type: integer, minimum: 1}
              unitPriceMinor: {type: integer, minimum: 0}
              taxRateBps: {type: integer, minimum: 0, maximum: 10000}
        totalMinor: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, submitted, approved, partially_received, received, cancelled]}
    ErpInvoice:
      type: object
      required: [organizationId, invoiceId, invoiceNumber, invoiceType, partyId, currency, issuedAt, dueAt, lines, subtotalMinor, taxMinor, totalMinor, status]
      properties:
        organizationId: {type: string}
        invoiceId: {type: string}
        invoiceNumber: {type: string, maxLength: 64}
        invoiceType: {type: string, enum: [sales, purchase]}
        partyId: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        issuedAt: {type: string, format: date-time}
        dueAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantityMilli, unitPriceMinor, taxRateBps]
            properties:
              description: {type: string}
              quantityMilli: {type: integer, minimum: 1}
              unitPriceMinor: {type: integer, minimum: 0}
              discountMinor: {type: integer, minimum: 0, default: 0}
              taxRateBps: {type: integer, minimum: 0, maximum: 10000}
        subtotalMinor: {type: integer, minimum: 0}
        taxMinor: {type: integer, minimum: 0}
        totalMinor: {type: integer, minimum: 1}
        status: {type: string, enum: [draft, issued, partially_paid, paid, void]}
    ErpInvoicePayment:
      type: object
      required: [paymentId, amountMinor, currency]
      properties:
        paymentId: {type: string}
        amountMinor: {type: integer, minimum: 1}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
    ErpJournalEntry:
      type: object
      required: [entryNumber, fiscalPeriodId, sourceType, sourceId, currency, lines, status, postedAt]
      properties:
        entryNumber: {type: string, maxLength: 64}
        fiscalPeriodId: {type: string}
        sourceType: {type: string}
        sourceId: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        lines:
          type: array
          minItems: 2
          items:
            type: object
            required: [accountCode, debitMinor, creditMinor, currency]
            properties:
              accountCode: {type: string}
              debitMinor: {type: integer, minimum: 0}
              creditMinor: {type: integer, minimum: 0}
              currency: {type: string}
              memo: {type: string}
        status: {type: string, enum: [posted]}
        postedAt: {type: string, format: date-time}
    CrmAccount:
      type: object
      required: [organizationId, accountId, name, accountType]
      properties:
        organizationId: {type: string}
        accountId: {type: string}
        name: {type: string, minLength: 2, maxLength: 160}
        accountType: {type: string, enum: [prospect, customer, partner]}
        industry: {type: string}
        website: {type: string, format: uri}
        ownerUserId: {type: string}
        status: {type: string, enum: [active, inactive], default: active}
    CrmContact:
      type: object
      required: [organizationId, contactId, firstName, lastName]
      properties:
        organizationId: {type: string}
        contactId: {type: string}
        accountId: {type: string}
        firstName: {type: string, maxLength: 80}
        lastName: {type: string, maxLength: 80}
        email: {type: string, format: email}
        phoneE164: {type: string}
        jobTitle: {type: string}
        marketingConsent: {type: string, enum: [granted, denied, unknown], default: unknown}
        consentCapturedAt: {type: string, format: date-time}
        consentSource: {type: string}
        status: {type: string, enum: [active, inactive], default: active}
    CrmLead:
      type: object
      required: [organizationId, leadId, firstName, lastName, source]
      properties:
        organizationId: {type: string}
        leadId: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string, format: email}
        phoneE164: {type: string}
        companyName: {type: string}
        source: {type: string, enum: [website, referral, campaign, partner, walk_in, import, other]}
        status: {type: string, enum: [new, qualified, converted, disqualified], default: new}
        assignedTo: {type: string}
        marketingConsent: {type: string, enum: [granted, denied, unknown], default: unknown}
        consentCapturedAt: {type: string, format: date-time}
        consentSource: {type: string}
    CrmOpportunity:
      type: object
      required: [organizationId, opportunityId, name, stage, amountMinor, currency, expectedCloseAt, ownerUserId]
      properties:
        organizationId: {type: string}
        opportunityId: {type: string}
        accountId: {type: string}
        contactId: {type: string}
        name: {type: string}
        stage: {type: string, enum: [prospecting, qualification, proposal, negotiation, won, lost]}
        amountMinor: {type: integer, minimum: 0}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        expectedCloseAt: {type: string, format: date-time}
        ownerUserId: {type: string}
        version: {type: integer, minimum: 0, default: 0}
    CrmActivity:
      type: object
      required: [organizationId, activityId, relatedType, relatedId, activityType, subject, occurredAt, status]
      properties:
        organizationId: {type: string}
        activityId: {type: string}
        relatedType: {type: string, enum: [account, contact, lead, opportunity]}
        relatedId: {type: string}
        activityType: {type: string, enum: [call, email, meeting, task, note]}
        subject: {type: string}
        occurredAt: {type: string, format: date-time}
        status: {type: string, enum: [planned, completed, cancelled]}
        description: {type: string, maxLength: 4000}
    CrmOpportunityStageUpdate:
      type: object
      required: [organizationId, stage, expectedVersion]
      properties:
        organizationId: {type: string}
        stage: {type: string, enum: [prospecting, qualification, proposal, negotiation, won, lost]}
        expectedVersion: {type: integer, minimum: 0}
    HrEmployee:
      type: object
      required: [organizationId, employeeId, employeeNumber, firstName, lastName, workEmail, departmentId, positionTitle, employmentType, startDate]
      properties:
        organizationId: {type: string}
        employeeId: {type: string}
        employeeNumber: {type: string, maxLength: 40}
        userId: {type: string}
        firstName: {type: string, maxLength: 80}
        lastName: {type: string, maxLength: 80}
        workEmail: {type: string, format: email}
        departmentId: {type: string}
        positionTitle: {type: string, maxLength: 120}
        managerEmployeeId: {type: string}
        employmentType: {type: string, enum: [permanent, contract, temporary, intern]}
        status: {type: string, enum: [active, on_leave, suspended, terminated], default: active}
        startDate: {type: string, format: date-time}
        endDate: {type: string, format: date-time}
    HrLeaveRequest:
      type: object
      required: [organizationId, leaveRequestId, employeeId, leaveType, startsAt, endsAt, days]
      properties:
        organizationId: {type: string}
        leaveRequestId: {type: string}
        employeeId: {type: string}
        leaveType: {type: string, enum: [annual, sick, personal, parental, unpaid]}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        days: {type: number, exclusiveMinimum: 0, maximum: 366}
        reason: {type: string, maxLength: 1000}
    HrLeaveDecision:
      type: object
      required: [organizationId, reason, expectedVersion]
      properties:
        organizationId: {type: string}
        reason: {type: string, minLength: 10, maxLength: 1000}
        expectedVersion: {type: integer, minimum: 0}
    PayrollRun:
      type: object
      required: [organizationId, payrollRunId, periodStart, periodEnd, jurisdiction, currency, calculationProvider, rulesetVersion, calculatedAt, lines, totalGrossMinor, totalStatutoryDeductionsMinor, totalVoluntaryDeductionsMinor, totalEmployerContributionsMinor, totalNetMinor]
      properties:
        organizationId: {type: string}
        payrollRunId: {type: string}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time}
        jurisdiction: {type: string, pattern: "^[A-Z]{2}$"}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        calculationProvider: {type: string}
        rulesetVersion: {type: string}
        calculatedAt: {type: string, format: date-time}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [employeeId, grossMinor, statutoryDeductionMinor, voluntaryDeductionMinor, employerContributionMinor, netMinor]
            properties:
              employeeId: {type: string}
              grossMinor: {type: integer, minimum: 0}
              statutoryDeductionMinor: {type: integer, minimum: 0}
              voluntaryDeductionMinor: {type: integer, minimum: 0}
              employerContributionMinor: {type: integer, minimum: 0}
              netMinor: {type: integer, minimum: 0}
        totalGrossMinor: {type: integer, minimum: 0}
        totalStatutoryDeductionsMinor: {type: integer, minimum: 0}
        totalVoluntaryDeductionsMinor: {type: integer, minimum: 0}
        totalEmployerContributionsMinor: {type: integer, minimum: 0}
        totalNetMinor: {type: integer, minimum: 0}
        status: {type: string, enum: [draft]}
    PayrollApproval:
      type: object
      required: [organizationId, reason, expectedVersion]
      properties:
        organizationId: {type: string}
        reason: {type: string, minLength: 20, maxLength: 2000}
        expectedVersion: {type: integer, minimum: 0}
    PaymentIntent:
      type: object
      required: [organizationId, paymentId, providerId, referenceType, referenceId, amountMinor, currency]
      properties:
        organizationId: {type: string}
        paymentId: {type: string}
        providerId: {type: string}
        referenceType: {type: string, enum: [invoice]}
        referenceId: {type: string}
        amountMinor: {type: integer, minimum: 1}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        status: {type: string, enum: [pending]}
    PaymentRefundRequest:
      type: object
      required: [organizationId, refundId, paymentId, amountMinor, reason]
      properties:
        organizationId: {type: string}
        refundId: {type: string}
        paymentId: {type: string}
        amountMinor: {type: integer, minimum: 1}
        reason: {type: string, minLength: 3, maxLength: 1000}
        status: {type: string, enum: [pending]}
    CommerceProduct:
      type: object
      required: [organizationId, productId, sku, name, currency, unitPriceMinor, taxRateBps]
      properties:
        organizationId: {type: string}
        productId: {type: string}
        sku: {type: string, maxLength: 100}
        name: {type: string, minLength: 2, maxLength: 180}
        description: {type: string, maxLength: 2000}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        unitPriceMinor: {type: integer, minimum: 0}
        taxRateBps: {type: integer, minimum: 0, maximum: 10000}
        status: {type: string, enum: [active, inactive], default: active}
    CommerceOrder:
      type: object
      required: [organizationId, orderId, customerId, warehouseId, reservationId, lines]
      properties:
        organizationId: {type: string}
        orderId: {type: string}
        customerId: {type: string}
        warehouseId: {type: string}
        reservationId: {type: string}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantityMilli]
            properties:
              sku: {type: string}
              quantityMilli: {type: integer, minimum: 1}
        status: {type: string, enum: [placed]}
    Asset:
      type: object
      required: [organizationId, assetId, assetTag, name, category, acquiredAt, acquisitionCostMinor, residualValueMinor, usefulLifeMonths, currency, depreciationMethod]
      properties:
        organizationId: {type: string}
