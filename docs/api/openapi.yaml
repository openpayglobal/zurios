openapi: 3.1.0
info:
  title: Zuri OS Platform API
  version: 1.0.0
  summary: Shared multi-tenant platform control-plane API
  description: |
    Version 1 platform contract for the shared Zuri OS API. Unversioned /platform aliases remain temporarily available and emit Deprecation and Sunset headers.
    Tenant context is derived from the authenticated principal; callers cannot
    select a tenant by supplying a tenant identifier. All platform modules
    consume these shared identity, organization, authorization, configuration,
    session and audit authorities.
servers:
  - url: /v1
    description: Version 1 API base path
security:
  - bearerAuth: []
tags:
  - name: Tenant
  - name: Organizations
  - name: Locations
  - name: Memberships
  - name: Roles
  - name: Policies
  - name: Feature flags
  - name: Sessions
  - name: Audit
  - name: MAC Authentication
  - name: MAC
paths:
  /platform/tenant:
    get:
      tags: [Tenant]
      operationId: getCurrentTenant
      summary: Get the authenticated tenant
      responses:
        "200":
          description: Tenant record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    anyOf:
                      - $ref: "#/components/schemas/Tenant"
                      - type: "null"
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform/organizations:
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List organizations within the authenticated membership scope
      responses:
        "200":
          description: Scoped organization list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [Organizations]
      operationId: createOrganization
      summary: Create an organization within the authenticated scope
      description: Root organization creation requires platform.organizations.create.root.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateOrganization"}
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Organization"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidReference"}
  /platform/locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: List locations within the authenticated location scope
      responses:
        "200":
          description: Scoped location list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Location"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [Locations]
      operationId: createLocation
      summary: Create a location in an assigned organization
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateLocation"}
      responses:
        "201":
          description: Location created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/Location"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/InvalidReference"}
  /platform/memberships:
    get:
      tags: [Memberships]
      operationId: listMemberships
      summary: List memberships intersecting the caller's organization scope
      responses:
        "200":
          description: Scoped membership list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Membership"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [Memberships]
      operationId: createMembership
      summary: Create a membership with validated organization and location scope
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMembership"}
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/InvalidReference"}
  /platform/roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List active tenant roles
      responses:
        "200":
          description: Active roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Role"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [Roles]
      operationId: createRole
      summary: Create a tenant role
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateRole"}
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /platform/policies:
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List tenant policies
      responses:
        "200":
          description: Tenant policies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Policy"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform/policies/{key}:
    put:
      tags: [Policies]
      operationId: upsertPolicy
      summary: Create or replace a tenant policy
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: key
          in: path
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PolicyInput"}
      responses:
        "200":
          description: Policy saved
          content:
            application/json:
              schema: {type: object, properties: {data: {type: object}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform/feature-flags:
    get:
      tags: [Feature flags]
      operationId: listFeatureFlags
      summary: List tenant feature flags
      responses:
        "200":
          description: Tenant feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/FeatureFlag"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform/feature-flags/{key}:
    put:
      tags: [Feature flags]
      operationId: setFeatureFlag
      summary: Set a tenant feature flag
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: key
          in: path
          required: true
          schema: {type: string, minLength: 2, maxLength: 100}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeatureFlagInput"}
      responses:
        "200":
          description: Feature flag saved
          content:
            application/json:
              schema: {type: object, properties: {data: {type: object}}}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform/sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: List permitted sessions without refresh-token material
      parameters:
        - name: userId
          in: query
          required: false
          schema: {type: string}
        - name: activeOnly
          in: query
          required: false
          schema: {type: boolean, default: true}
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /platform/sessions/{sessionId}/revoke:
    post:
      tags: [Sessions]
      operationId: revokeSession
      summary: Revoke a permitted active session
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: sessionId
          in: path
          required: true
          schema: {type: string, minLength: 1}
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {description: Session not found in caller's permitted scope}
  /platform/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: List tenant audit events
      parameters:
        - name: action
          in: query
          required: false
          schema: {type: string}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/AuditEvent"}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /mac/auth/bootstrap:
    post:
      security: []
      tags: [MAC Authentication]
      operationId: bootstrapPlatformOperator
      summary: Create the one-time initial platform operator
      description: Requires the out-of-band bootstrap token. Available only while no platform operator exists. Returns the TOTP secret once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MacBootstrapInput"}
      responses:
        "201": {description: Initial operator created; TOTP enrollment secret returned once}
        "400": {$ref: "#/components/responses/InvalidRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "409": {description: Bootstrap has already been completed}
        "503": {description: MAC authentication secrets are not configured}
  /mac/auth/bootstrap/confirm:
    post:
      security: []
      tags: [MAC Authentication]
      operationId: confirmPlatformOperatorBootstrap
      summary: Confirm initial operator MFA and activate the platform
      responses:
        "201": {description: Operator activated and initial session issued}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "409": {description: Bootstrap already completed}
  /mac/auth/login:
    post:
      security: []
      tags: [MAC Authentication]
      operationId: loginPlatformOperator
      summary: Authenticate a platform operator with password and TOTP
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MacLoginInput"}
      responses:
        "200": {description: Independent MAC access and refresh tokens}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "429": {description: Rate limit exceeded}
        "503": {description: MAC authentication secrets are not configured}
  /mac/auth/refresh:
    post:
      security: []
      tags: [MAC Authentication]
      operationId: refreshPlatformOperatorSession
      summary: Rotate a platform operator refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MacRefreshInput"}
      responses:
        "200": {description: Rotated refresh token and new access token}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /mac/auth/logout:
    post:
      tags: [MAC Authentication]
      operationId: logoutPlatformOperator
      summary: Revoke the current platform operator session
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /mac/auth/me:
    get:
      tags: [MAC Authentication]
      operationId: getCurrentPlatformOperator
      summary: Get the current global platform operator
      responses:
        "200": {description: Current operator identity and permissions}
        "401": {$ref: "#/components/responses/Unauthenticated"}
  /mac/overview:
    get:
      tags: [MAC]
      operationId: getMacOverview
      summary: Read platform control-plane overview metrics
      responses:
        "200": {description: Aggregated platform counts and explicit integration status}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /mac/tenants:
    get:
      tags: [MAC]
      operationId: listMacTenants
      summary: List tenants using bounded cursor pagination
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - in: query
          name: after
          schema: {type: string}
      responses:
        "200": {description: Paginated tenant records}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /mac/audit:
    get:
      tags: [MAC]
      operationId: listMacAuditEvents
      summary: Read global administrative audit events
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 25}
        - in: query
          name: before
          schema: {type: string, format: date-time}
      responses:
        "200": {description: Administrative audit events}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated unique key for safe retries. The same key and request replay the original response for 24 hours; reusing it with a different request returns 409.
      schema: {type: string, minLength: 8, maxLength: 128}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthenticated:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Permission or scope denied
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: Conflicting or duplicate state
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    InvalidReference:
      description: Referenced resource is invalid or outside required scope
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        issues:
          type: array
          items:
            type: object
            properties:
              path: {type: array, items: {}}
              message: {type: string}
    Tenant:
      type: object
      properties:
        tenantId: {type: string}
        slug: {type: string}
        legalName: {type: string}
        displayName: {type: string}
        status: {type: string}
        defaultLocale: {type: string}
        defaultCurrency: {type: string}
        timezone: {type: string}
    Organization:
      type: object
      properties:
        tenantId: {type: string}
        organizationId: {type: string}
        parentOrganizationId: {type: string}
        code: {type: string}
        name: {type: string}
        type: {type: string, enum: [group, company, business_unit, department, branch]}
        status: {type: string}
        path: {type: array, items: {type: string}}
    OrganizationList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Organization"}
    CreateOrganization:
      type: object
      required: [code, name, type]
      properties:
        code: {type: string, minLength: 1, maxLength: 40}
        name: {type: string, minLength: 2, maxLength: 150}
        type: {type: string, enum: [group, company, business_unit, department, branch]}
        parentOrganizationId: {type: string}
    Location:
      type: object
      properties:
        tenantId: {type: string}
        locationId: {type: string}
        organizationId: {type: string}
        parentLocationId: {type: string}
        code: {type: string}
        name: {type: string}
        type: {type: string, enum: [site, store, warehouse, office, other]}
        status: {type: string}
        timezone: {type: string}
    CreateLocation:
      type: object
      required: [organizationId, code, name, type]
      properties:
        organizationId: {type: string, minLength: 1}
        code: {type: string, minLength: 1, maxLength: 40}
        name: {type: string, minLength: 2, maxLength: 150}
        type: {type: string, enum: [site, store, warehouse, office, other]}
        parentLocationId: {type: string}
        timezone: {type: string}
        address: {type: object, additionalProperties: {type: string}}
    Membership:
      type: object
      properties:
        tenantId: {type: string}
        membershipId: {type: string}
        userId: {type: string}
        organizationIds: {type: array, items: {type: string}}
        locationIds: {type: array, items: {type: string}}
        roleIds: {type: array, items: {type: string}}
        status: {type: string}
    CreateMembership:
      type: object
      required: [userId, organizationIds]
      properties:
        userId: {type: string, minLength: 1}
        organizationIds: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        locationIds: {type: array, items: {type: string, minLength: 1}, default: []}
        roleIds: {type: array, items: {type: string, minLength: 1}, default: []}
    Role:
      type: object
      properties:
        tenantId: {type: string}
        roleId: {type: string}
        key: {type: string}
        name: {type: string}
        permissionKeys: {type: array, items: {type: string}}
        isSystem: {type: boolean}
        status: {type: string}
    CreateRole:
      type: object
      required: [key, name, permissionKeys]
      properties:
        key: {type: string, minLength: 2, maxLength: 100}
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, maxLength: 500}
        permissionKeys: {type: array, maxItems: 500, items: {type: string, minLength: 1}}
        isSystem: {type: boolean, default: false}
    Policy:
      type: object
      properties:
        tenantId: {type: string}
        policyId: {type: string}
        key: {type: string}
        effect: {type: string, enum: [allow, deny]}
        priority: {type: integer}
        actions: {type: array, items: {type: string}}
        status: {type: string}
    PolicyInput:
      type: object
      required: [effect, priority, actions]
      properties:
        effect: {type: string, enum: [allow, deny]}
        priority: {type: integer, minimum: 0, maximum: 10000}
        subject: {type: object, default: {}, additionalProperties: true}
        resource: {type: object, default: {}, additionalProperties: true}
        actions: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        conditions: {type: object, default: {}, additionalProperties: true}
    FeatureFlag:
      type: object
      properties:
        tenantId: {type: string}
        key: {type: string}
        enabled: {type: boolean}
        environments: {type: array, items: {type: string}}
        rules: {type: array, items: {type: object, additionalProperties: true}}
    FeatureFlagInput:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
        description: {type: string, maxLength: 500}
        environments: {type: array, items: {type: string, minLength: 1}, default: [development]}
        rules: {type: array, items: {type: object, additionalProperties: true}, default: []}
    Session:
      type: object
      properties:
        tenantId: {type: string}
        sessionId: {type: string}
        userId: {type: string}
        membershipId: {type: string}
        expiresAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        revokedAt: {type: string, format: date-time}
    AuditEvent:
      type: object
      properties:
        eventId: {type: string}
        tenantId: {type: string}
        occurredAt: {type: string, format: date-time}
        actor:
          type: object
          properties:
            userId: {type: string}
            service: {type: string}
            ipHash: {type: string}
            userAgent: {type: string}
        action: {type: string}
        resourceType: {type: string}
        resourceId: {type: string}
        outcome: {type: string, enum: [success, denied, failure]}
        correlationId: {type: string}
        metadata: {type: object, additionalProperties: true}
